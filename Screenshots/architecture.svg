<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<rect width="1100" height="520" rx="12" fill="#0f172a"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#94a3b8"/></marker></defs>
<text x="550.0" y="36" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">PackageClaimKit</text>
<text x="550.0" y="60" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">do&#160;the&#160;packages&#160;an&#160;answer&#160;tells&#160;someone&#160;to&#160;install&#160;exist,&#160;on&#160;the&#160;registry&#160;the&#160;command&#160;uses,&#160;at&#160;the&#160;pinned&#160;version?</text>
<rect x="30" y="90" width="240" height="100" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
<text x="150.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ProviderGatewayKit</text>
<text x="150.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">sends&#160;the&#160;turn</text>
<text x="150.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">the&#160;answer&#160;comes&#160;back</text>
<rect x="320" y="90" width="300" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="470.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PackageReader</text>
<text x="470.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">install&#160;and&#160;run&#160;commands&#160;in&#160;code</text>
<text x="470.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">pip,&#160;uv,&#160;npm,&#160;npx,&#160;yarn,&#160;pnpm,&#160;bun,&#160;cargo</text>
<text x="470.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">requirements.txt,&#160;package.json,&#160;Cargo.toml</text>
<text x="470.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">exact&#160;pins&#160;only;&#160;paths&#160;and&#160;URLs&#160;left&#160;out</text>
<rect x="670" y="90" width="400" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="870.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PackageVetter&#160;(actor)</text>
<text x="870.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">one&#160;per&#160;conversation</text>
<text x="870.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">concurrent&#160;lookups,&#160;remembered&#160;answers</text>
<text x="870.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">a&#160;missing&#160;name&#160;is&#160;looked&#160;up&#160;on&#160;the&#160;other</text>
<text x="870.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">registries:&#160;the&#160;wrong&#160;installer</text>
<rect x="670" y="280" width="400" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="870.0" y="304" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PackageRegistry</text>
<text x="870.0" y="326" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">PublicRegistry:&#160;pypi.org,&#160;registry.npmjs.org,</text>
<text x="870.0" y="344" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">crates.io&#160;over&#160;HTTPS&#160;(name&#160;only)</text>
<text x="870.0" y="362" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">StaticRegistry:&#160;tests,&#160;demos,&#160;offline</text>
<rect x="320" y="280" width="300" height="120" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
<text x="470.0" y="304" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PackageEvaluator</text>
<text x="470.0" y="326" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">not&#160;found,&#160;no&#160;release,&#160;missing&#160;version</text>
<text x="470.0" y="344" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">days&#160;old,&#160;deprecated,&#160;look-alike</text>
<text x="470.0" y="362" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">+&#160;WellKnownPackages&#160;near-misses;&#160;pure</text>
<rect x="30" y="280" width="240" height="200" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
<text x="150.0" y="304" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PackageReport</text>
<text x="150.0" y="326" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">verified&#160;/&#160;unchecked&#160;/</text>
<text x="150.0" y="344" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">caution&#160;/&#160;wrong</text>
<text x="150.0" y="362" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">note&#160;for&#160;the&#160;user</text>
<text x="150.0" y="380" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">feedback&#160;re-prompt</text>
<text x="150.0" y="398" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">one-line&#160;summary</text>
<text x="150.0" y="416" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">ai-chat-app:&#160;packageCheck</text>
