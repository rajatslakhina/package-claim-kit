<text x="550.0" y="500" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Swift&#160;6&#160;·&#160;actors&#160;·&#160;Sendable&#160;value&#160;types&#160;·&#160;no&#160;dependencies&#160;·&#160;33&#160;tests&#160;·&#160;100%&#160;coverage</text>
